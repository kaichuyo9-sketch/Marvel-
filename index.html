<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marvel Infinity Watchlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --marvel-red: #EC1D24;
            --dark-bg: #101010;
            --card-bg: #161616;
            --border: #2a2a2a;
            --text-grey: #8a8a8a;
            --space: #4d8ef5; --reality: #EC1D24; --power: #9b4de0;
            --time: #18b878; --mind: #d4a800; --soul: #e06418;
        }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'Barlow', sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background: black;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 10px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-badge {
            background: var(--marvel-red);
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            padding: 5px 10px;
            font-size: 20px;
            letter-spacing: 1px;
            margin-right: 30px;
        }

        .nav-links a {
            color: var(--text-grey);
            text-decoration: none;
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            font-weight: 700;
            margin-right: 20px;
            font-size: 14px;
        }

        .nav-links a.active {
            color: white;
            border-bottom: 3px solid var(--marvel-red);
            padding-bottom: 18px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            border-bottom: 1px solid var(--border);
        }

        .hero h2 {
            font-family: 'Barlow Condensed', sans-serif;
            color: var(--marvel-red);
            letter-spacing: 5px;
            font-size: 12px;
            text-transform: uppercase;
        }

        .hero h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 800;
            font-size: 48px;
            text-transform: uppercase;
            margin: 10px 0;
        }

        .stones {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .stone-item {
            text-align: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-grey);
        }

        .stone {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .main-progress {
            background: var(--card-bg);
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: #333;
        }

        .progress-fill {
            height: 100%;
            background: var(--marvel-red);
            width: 0%;
            transition: width 0.3s;
        }

        .list-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .phase-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--marvel-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .phase-title h3 {
            font-family: 'Barlow Condensed', sans-serif;
            text-transform: uppercase;
            margin: 0;
            font-size: 24px;
        }

        .movie-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .movie-item:hover {
            background: var(--card-bg);
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .movie-item.done .checkbox {
            background: var(--marvel-red);
            border-color: var(--marvel-red);
        }

        .movie-item.done .checkbox::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .movie-info {
            flex: 1;
        }

        .movie-title {
            font-weight: 600;
            font-size: 16px;
        }

        .movie-year {
            font-size: 12px;
            color: var(--text-grey);
        }
